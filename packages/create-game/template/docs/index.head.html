<!-- before first paint, so the saved theme never flashes (the same snippet theme.ts exports as THEME_BOOT_SCRIPT) -->
<script>try{var t=localStorage.getItem('THEME_KEY');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<!-- at the end of <body>: anonymous visit counts; also gives window.track() -->
<script src="https://0801564.xyz/a.js" data-site="SITE" defer></script>
